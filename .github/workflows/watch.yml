name: showwatch

on:
  schedule:
    # Every 5 minutes is the GitHub minimum. Actual firing drifts under load,
    # so treat this as "within ~10 min", not a precise clock.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# state.json is committed back each run, so two overlapping runs would race.
concurrency:
  group: showwatch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Poll and alert
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python watch.py

      - name: Persist state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name  "showwatch"
            git config user.email "showwatch@users.noreply.github.com"
            git add state.json
            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Another run may have pushed while this one polled.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          else
            echo "no change"
          fi
