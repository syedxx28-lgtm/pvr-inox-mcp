<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="PVR seat watcher">
  <rect width="64" height="64" rx="14" fill="#0D0D0D"/>
  <rect x="0.6" y="0.6" width="62.8" height="62.8" rx="13.4" fill="none" stroke="#3A3A46" stroke-width="1.2"/>

  <text x="32" y="33" text-anchor="middle"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-weight="700" font-size="21" letter-spacing="0.5" fill="#F5C518">PVR</text>

  <!-- Seat row instead of a strapline: the centre block lit, the edges not -->
  <g>
    <rect x="14" y="42" width="7" height="8" rx="2" fill="#3F3F48"/>
    <rect x="23.5" y="42" width="7" height="8" rx="2" fill="#F5C518"/>
    <rect x="33" y="42" width="7" height="8" rx="2" fill="#F5C518"/>
    <rect x="42.5" y="42" width="7" height="8" rx="2" fill="#3F3F48"/>
  </g>
</svg>
